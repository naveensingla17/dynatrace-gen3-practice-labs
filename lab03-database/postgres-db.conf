CREATE DATABASE retaildb;

\c retaildb # to connect to the database

CREATE TABLE orders (
  id SERIAL PRIMARY KEY,
  customer_name VARCHAR(100),
  product VARCHAR(100),
  amount NUMERIC,
  status VARCHAR(20),
  created_at TIMESTAMP DEFAULT now()
);

sudo -iu postgres psql -d retaildb

INSERT INTO orders(customer_name, product, amount, status)
SELECT
  'customer_' || generate_series,
  'product_' || (generate_series % 10),
  random() * 1000,
  CASE WHEN generate_series % 5 = 0 THEN 'FAILED' ELSE 'SUCCESS' END
FROM generate_series(1, 10000);

####validate###########

SELECT COUNT(*) FROM orders;

SELECT status, COUNT(*)
FROM orders
GROUP BY status;



CREATE USER dynatrace WITH PASSWORD 'Dynatrace@123' INHERIT;
GRANT CONNECT ON DATABASE retaildb TO dynatrace;
GRANT USAGE ON SCHEMA public TO dynatrace;
GRANT SELECT ON ALL TABLES IN SCHEMA public TO dynatrace;
ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO dynatrace;

