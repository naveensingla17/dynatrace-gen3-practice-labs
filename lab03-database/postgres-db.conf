extension




name: "custom:postgres"
minDynatraceVersion: "1.303.0"
author:
  name: "Custom Extensions Creator App"
version: "1.0.1"
sqlPostgres:
  - group: "Failed Orders"
    interval:
      minutes: 1
    query: "SELECT COUNT(*) AS failed_orders

      FROM public.orders

      WHERE status = 'FAILED'\n"
    metrics:
      - key: "custom.postgres.failed_orders"
        value: "col:failed_orders"
        type: "gauge"









